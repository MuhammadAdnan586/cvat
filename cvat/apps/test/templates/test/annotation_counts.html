<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Annotations per class, task {{ task_id }}</title>
  <style>
    body { font-family: sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
    .row { display: flex; align-items: center; margin: 4px 0; }
    .label { width: 160px; text-align: right; padding-right: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar { background: #1677ff; height: 18px; min-width: 2px; }
    .value { padding-left: 8px; }
    .message { padding: 1rem; border-radius: 6px; background: #f5f5f5; }
    .message.error { background: #fff1f0; }
  </style>
</head>
<body>
  <h1>Annotations per class, task {{ task_id }}</h1>
  <div id="status" class="message">Loading...</div>
  <div id="chart"></div>

  <script>
    const url = "/api/tasks/{{ task_id }}/annotation-counts";
    const status = document.getElementById("status");
    const chart = document.getElementById("chart");

    function showError(text) {
      chart.replaceChildren();
      status.className = "message error";
      status.replaceChildren(text + " ");
      const retry = document.createElement("button");
      retry.textContent = "Retry";
      retry.onclick = load;
      status.append(retry);
    }

    function render(data) {
      chart.replaceChildren();
      if (data.total === 0) {
        status.className = "message";
        status.textContent = "This task has no annotations yet.";
        return;
      }
      status.className = "message";
      status.textContent = data.total + " annotations in " + data.counts.length + " classes";
      const max = Math.max(...data.counts.map((c) => c.count));
      for (const item of data.counts) {
        const row = document.createElement("div");
        row.className = "row";
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = item.label;
        const bar = document.createElement("div");
        bar.className = "bar";
        bar.style.width = (item.count / max) * 60 + "%";
        const value = document.createElement("div");
        value.className = "value";
        value.textContent = item.count;
        row.append(label, bar, value);
        chart.append(row);
      }
    }

    async function load() {
      status.className = "message";
      status.textContent = "Loading...";
      try {
        const response = await fetch(url, { credentials: "same-origin" });
        if (!response.ok) {
          showError("Request failed (HTTP " + response.status + ").");
          return;
        }
        render(await response.json());
      } catch (error) {
        showError("Could not reach the server.");
      }
    }

    load();
  </script>
</body>
</html>
